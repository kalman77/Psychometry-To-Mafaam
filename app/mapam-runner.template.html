<style>
:root{
  /* a quiet room: desaturated eucalyptus and warm paper, nothing that raises a pulse */
  --mist:#EDF1EE; --mist-deep:#E3EAE5; --surface:#FCFDFC;
  --ink:#243330; --muted:#79877F; --line:#DFE7E2;
  --sage:#6F9D86; --sage-050:#E6EFE9; --sage-100:#CFE0D6;
  --sand:#D5B074; --clay:#C48C82;
  --deep:#1F2B27;

  --display:"Bellefair",Georgia,serif;
  --sans:"Rubik","Segoe UI",system-ui,sans-serif;
  --read:"Noto Serif Hebrew",Georgia,serif;
  --num:"Outfit","Rubik",system-ui,sans-serif;

  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(36,51,48,.04), 0 18px 40px -24px rgba(36,51,48,.22);
  --shadow-lift:0 2px 4px rgba(36,51,48,.05), 0 28px 56px -28px rgba(36,51,48,.28);
  --ease:cubic-bezier(.22,.8,.28,1);
  --pad:clamp(20px,4vw,44px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--mist);color:var(--ink);
  font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,5.4vw,54px)}

/* the journey rail: the whole sitting at a glance, so time is never a surprise */
#rail{position:fixed;inset-block-start:0;inset-inline:0;height:2px;background:var(--mist-deep);z-index:60}
#rail i{display:block;height:100%;width:0;background:var(--sage-100);transition:width .6s var(--ease)}

/* the time dial: one question's clock, unwinding */
#dial{
  position:fixed;inset-block-start:16px;left:16px;z-index:61;
  width:76px;height:76px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
#dial.hidden{opacity:0;transform:scale(.9);pointer-events:none}
#dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#dial circle{fill:none;stroke-width:2.5;stroke-linecap:round}
#dial .track{stroke:var(--sage-050)}
#dial .arc{stroke:var(--sage);transition:stroke .9s linear}
#dial.warm .arc{stroke:var(--sand)} #dial.late .arc{stroke:var(--clay)}
#dial b{font-family:var(--num);font-weight:400;font-size:16px;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;direction:ltr;color:var(--ink);transition:color .9s linear}
#dial.late b{color:var(--clay)}
@media (max-width:720px){#dial{width:60px;height:60px;inset-block-start:10px;left:10px}#dial b{font-size:14px}}

/* shell */
.stage{min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:26px var(--pad) 0;justify-content:center}
.tag{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:400;white-space:nowrap}
.tag.dot::before{content:'';display:inline-block;width:3px;height:3px;border-radius:50%;
  background:var(--sage-100);margin-inline-end:10px;vertical-align:middle}

.sheet{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:22px var(--pad) 0;
  display:grid;gap:clamp(16px,2.4vw,26px);align-content:start}
.sheet.split{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:start}
@media (max-width:940px){.sheet.split{grid-template-columns:1fr}}
.sheet.narrow{max-width:760px}
/* `safe` so a stem taller than the viewport still starts at the top. */
.sheet.centred{align-content:safe center}
.sheet.wide{max-width:min(1600px,96vw)}
/* Beside a passage the scan still needs the larger share — the passage
   scrolls, the picture cannot. */
.sheet.scan.split{max-width:min(1800px,97vw);
  grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr)}
@media (max-width:940px){.sheet.scan.split{grid-template-columns:1fr}}

/* A scanned question: give the picture the room, keep the answer row compact. */
.scan .card{padding:clamp(12px,1.3vw,20px)}
.scan-img{display:block;width:100%;height:auto;max-height:70dvh;object-fit:contain;
  margin-inline:auto;border-radius:var(--r-sm)}
.stem-img{display:block;max-width:100%;margin-block-start:20px;border-radius:var(--r-sm)}
.scan-passage{display:block;width:100%;height:auto;border-radius:var(--r-sm)}
.inline-figure{display:block;max-width:100%;border-radius:var(--r-sm)}
/* Both halves carry a picture now, so neither gets to crowd the other. */
.sheet.scan.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

/* a small modal for one sentence and a way out */
.notice-modal{position:fixed;inset:0;z-index:80;pointer-events:none;visibility:hidden;
  transition:visibility 0s linear .3s}
.notice-modal[data-open=true]{pointer-events:auto;visibility:visible;transition-delay:0s}
.notice-scrim{position:absolute;inset:0;background:rgba(31,43,39,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .3s var(--ease)}
.notice-modal[data-open=true] .notice-scrim{opacity:1}
.notice-card{position:absolute;inset-block-start:50%;inset-inline-start:50%;
  width:min(430px,90vw);padding:clamp(24px,3vw,34px);text-align:center;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);
  transform:translate(50%,-50%) scale(.94);opacity:0;
  transition:transform .32s var(--ease),opacity .32s var(--ease)}
[dir=ltr] .notice-card{transform:translate(-50%,-50%) scale(.94)}
.notice-modal[data-open=true] .notice-card{opacity:1;transform:translate(50%,-50%) scale(1)}
[dir=ltr] .notice-modal[data-open=true] .notice-card{transform:translate(-50%,-50%) scale(1)}
.notice-card h3{font-size:23px;margin:0 0 10px}
.notice-card p{color:var(--muted);font-size:15px;line-height:1.7;margin:0 0 22px}

/* The mark, above the opening screen's title. */
.hero-logo{width:min(190px,44vw);aspect-ratio:420/389;margin:0 auto 6px;

/* ---- the opening screen ------------------------------------------------- */
/* Three washes of colour drifting behind the page. Slow enough to read as
   light rather than movement, and stilled entirely for reduced motion. */
.setup-stage{position:relative;overflow:hidden}
.setup-wash{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.setup-wash i{position:absolute;display:block;border-radius:50%;filter:blur(80px);opacity:.34}
.setup-wash i:nth-child(1){width:46vw;height:46vw;inset-block-start:-14vw;inset-inline-end:-10vw;
  background:var(--sage-100);animation:drift 26s var(--ease) infinite alternate}
.setup-wash i:nth-child(2){width:38vw;height:38vw;inset-block-start:24vh;inset-inline-start:-12vw;
  background:#EADFC9;animation:drift 32s var(--ease) infinite alternate-reverse}
.setup-wash i:nth-child(3){width:30vw;height:30vw;inset-block-end:-12vw;inset-inline-end:18vw;
  background:var(--sage-050);animation:drift 22s var(--ease) infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(2vw,-3vh,0) scale(1.12)}}
.setup-stage>.sheet{position:relative;z-index:1}

.hero{text-align:center;padding-block-end:4px}
.hero-eyebrow{display:inline-block;padding:6px 15px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 76%,transparent);
  border:1px solid var(--sage-100);backdrop-filter:blur(6px);margin:0}
.hero-title{margin-block:16px 12px;font-size:clamp(38px,6.4vw,62px);line-height:1.05;
  background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--sage) 62%,var(--ink)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{color:var(--muted);max-width:46ch;margin:0 auto;font-size:16.5px;line-height:1.75}

/* The way in: drop a booklet, or take the example. */
.intake{display:grid;gap:14px;justify-items:center}
.intake>*{width:100%}
.drop{display:grid;justify-items:center;gap:7px;padding:clamp(26px,4vw,40px) 22px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px)}
.drop-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--sage-050);border:1px solid var(--sage-100);
  transition:transform .3s var(--ease),background .3s var(--ease)}
.drop-mark::after{content:"";width:12px;height:12px;border-left:2px solid var(--sage);
  border-top:2px solid var(--sage);transform:translateY(3px) rotate(45deg)}
.drop:hover .drop-mark{transform:translateY(-3px)}
.drop.over .drop-mark{background:var(--sage-100);animation:nudge .9s var(--ease) infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drop-hint{color:var(--muted);font-size:14.5px}
.intake-or{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13.5px}
.intake-or::before,.intake-or::after{content:"";flex:1;height:1px;background:var(--line)}
.intake-demo{justify-self:center;width:auto}

/* The shelf: rows that lift, and a page that slides in behind them. */
.library-list li{transition:transform .2s var(--ease)}
.library-list li:hover{transform:translateX(-3px)}
[dir=ltr] .library-list li:hover{transform:translateX(3px)}
#library-body{animation:page-in .32s var(--ease) both}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* The start button, once a booklet is loaded: the one thing on the screen that
   asks to be pressed, so it gets the only sweep of light on the page. */
.controls .btn:not(.quiet),#start{position:relative;overflow:hidden}
#start::after{content:"";position:absolute;inset-block:0;inset-inline-start:-60%;width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:sheen 4.6s var(--ease) infinite}
@keyframes sheen{0%,62%{inset-inline-start:-60%}100%{inset-inline-start:130%}}

.setup-foot{text-align:center;color:var(--muted);font-size:14px;margin:2px 0 0}

/* The one action the screen is for. */
#start{padding:15px 44px;font-size:17px;border-radius:999px;
  box-shadow:0 10px 26px -12px color-mix(in srgb,var(--sage) 70%,transparent)}
#start:hover{transform:translateY(-2px);
  box-shadow:0 16px 34px -14px color-mix(in srgb,var(--sage) 78%,transparent)}
#start:active{transform:translateY(0)}

@media (prefers-reduced-motion:reduce){
  .setup-wash i{animation:none}
  #start::after{display:none}
  .drop.over .drop-mark{animation:none}
}

/* ---- the screens between the questions ---------------------------------- */
/* A chapter title and a break are the two moments the learner is not being
   timed on a question, so they can carry the colour the exam screens should
   not. Same washes as the opening screen, in the dark register. */
.bleed{position:relative;overflow:hidden}
.bleed::before,.bleed::after{content:"";position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.5;pointer-events:none}
.bleed::before{width:52vw;height:52vw;inset-block-start:-18vw;inset-inline-end:-14vw;
  background:#2F473E;animation:drift 30s var(--ease) infinite alternate}
.bleed::after{width:40vw;height:40vw;inset-block-end:-16vw;inset-inline-start:-10vw;
  background:#3A4A3C;animation:drift 24s var(--ease) infinite alternate-reverse}
.bleed>*{position:relative;z-index:1}
.bleed h1{font-size:clamp(40px,7vw,68px);line-height:1.04;letter-spacing:-.01em}
.bleed .tag{letter-spacing:.14em;text-transform:none}
.bleed .btn{padding:13px 34px;border-radius:999px;font-size:15.5px;
  transition:background .24s var(--ease),color .24s var(--ease),
    border-color .24s var(--ease),transform .24s var(--ease)}
.bleed .btn:hover{border-color:#5E7A6D;transform:translateY(-2px)}

/* ---- a question on screen ---------------------------------------------- */
/* Refinement only. Nothing here should pull the eye off the question: the
   clock is already running. */
.topbar .tag{padding:5px 13px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 70%,transparent);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  backdrop-filter:blur(6px)}
.topbar .tag.dot::before{display:none}

.opt{transition:background .18s var(--ease),border-color .18s var(--ease),
  transform .18s var(--ease),box-shadow .18s var(--ease)}
.opt:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.opt:active{transform:translateY(0)}
.opt[aria-checked=true]{box-shadow:0 0 0 1px var(--sage) inset}
.opt[aria-checked=true] .pip{background:var(--sage);border-color:var(--sage);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--sage) 22%,transparent)}
.opt .pip{transition:background .18s var(--ease),border-color .18s var(--ease),
  box-shadow .18s var(--ease)}

/* ---- the results ------------------------------------------------------- */
/* The numbers are what the learner came back for, so they arrive rather than
   appear. Staggered off the card, and stilled for reduced motion. */
.stats .stat{animation:count-in .5s var(--ease) both}
.stats .stat:nth-child(2){animation-delay:.08s}
.stats .stat:nth-child(3){animation-delay:.16s}
@keyframes count-in{from{opacity:0;transform:translateY(8px) scale(.98)}
  to{opacity:1;transform:none}}
.stat .v{font-variant-numeric:tabular-nums}
.stat{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}

@media (prefers-reduced-motion:reduce){
  .bleed::before,.bleed::after{animation:none}
  .stats .stat{animation:none}
}

/* ---- the scoreboard, before the full debrief ---------------------------- */
.score-head{text-align:center;padding:18px 22px;border-radius:var(--r-lg);
  background:var(--deep);color:#F1F5F2}
.score-head p{margin:0;font-size:clamp(19px,2.6vw,26px);font-family:var(--display)}
.score-head b{font-family:var(--num);font-weight:400;font-variant-numeric:tabular-nums}
.score-head-num b{color:var(--sand)}
.score-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.score-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-block-end:10px;margin-block-end:12px;border-block-end:1px solid var(--line)}
.score-card-head h3{margin:0}
.score-card-head b{font-family:var(--num);font-weight:400;font-size:27px;
  font-variant-numeric:tabular-nums;color:var(--sage)}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  margin-block-end:8px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.score-row-name{font-size:14.5px}
.score-row-bar{display:flex;align-items:center;gap:10px;flex:none}
.score-row-bar b{font-family:var(--num);font-weight:400;font-size:13.5px;
  font-variant-numeric:tabular-nums;color:var(--muted);min-width:38px;text-align:start}
.dots{display:flex;gap:4px;direction:ltr}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--mist-deep);
  animation:dot-in .3s var(--ease) both}
.dots i.on{background:var(--sage)}
.dots i:nth-child(2){animation-delay:.03s} .dots i:nth-child(3){animation-delay:.06s}
.dots i:nth-child(4){animation-delay:.09s} .dots i:nth-child(5){animation-delay:.12s}
.dots i:nth-child(6){animation-delay:.15s} .dots i:nth-child(7){animation-delay:.18s}
.dots i:nth-child(8){animation-delay:.21s} .dots i:nth-child(9){animation-delay:.24s}
.dots i:nth-child(10){animation-delay:.27s}
@keyframes dot-in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

/* ---- the review: the booklet's chapters, marked ------------------------- */
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:flex-end;
  margin-block-end:18px;font-size:13.5px;color:var(--muted)}
.legend-item{display:flex;align-items:center;gap:7px}
.mark{width:15px;height:15px;border-radius:4px;flex:none;
  border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.mark.correct{background:var(--sage)}
.mark.wrong{background:var(--clay)}
.mark.blank{background:var(--surface);border-style:dashed;border-color:var(--clay)}
.mark.not-asked{background:var(--sand);opacity:.28}

.chapter-domain{margin-block-end:26px}
.chapter-domain-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;padding:12px 18px;border-radius:var(--r-md);
  background:var(--deep);color:var(--surface);font-size:17px}
.chapter-domain-head b{font-family:var(--num);font-size:20px;color:var(--sand)}
.chapter{background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--shadow);padding:16px 14px 18px;margin-block-start:12px}
.chapter h4{margin:0 0 4px;font-family:var(--display);font-size:21px;font-weight:400}
.chapter h4+.qgrid{border-block-start:1px solid var(--line);padding-block-start:16px}

/* Nine to a row, filling from the right: the booklet is read that way, and so
   is its answer sheet. */
/* Nine to a row, as the booklet's own answer sheet is laid out; five when
   there is no room for nine. */
.qgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:9px 2px;direction:rtl}
@media (max-width:520px){.qgrid{grid-template-columns:repeat(5,1fr)}}
.qcell{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 1px;border:0;background:none;font:inherit;border-radius:var(--r-sm);
  cursor:pointer;transition:transform .16s var(--ease),background .16s var(--ease)}
.qcell:hover:not(:disabled){background:var(--sage-050);transform:translateY(-2px)}
/* Every question opens, including one the sitting never drew — the chapter is
   there to be worked through, not only inspected where the sampling landed. */
.qcell .qnum{font-family:var(--num);font-size:12.5px;color:var(--ink);opacity:.75}
.qcell:disabled .qnum{opacity:.4}
.qcell .mark{width:22px;height:22px;border-radius:6px}
.qcell.open{background:var(--sage-050)}
.qcell.open .mark{box-shadow:0 0 0 2px var(--ink)}

/* The chapters on the right, the question you picked on the left, and the
   left column follows you down the page. Under 1000px there is not room for
   two, so the question drops beneath the chapters it came from. */
/* The question takes most of the width: it is a scan of a printed page and has
   to be readable, while the chapters beside it are only rows of squares. The
   grid column is given just enough for nine of them. */
.review-layout{display:grid;grid-template-columns:minmax(250px,.42fr) minmax(0,1.58fr);
  gap:20px;align-items:start;margin-block-start:4px}
@media (max-width:900px){.review-layout{grid-template-columns:minmax(0,1fr)}}
.review-detail{position:sticky;inset-block-start:16px}
@media (max-width:1000px){.review-detail{position:static}}

.qdetail{margin-block-start:0;scroll-margin-block-start:20px}
.qdetail-empty{margin:0;text-align:center;padding-block:28px}
.qdetail .scan-img{width:100%;max-height:none}
.qdetail .stem-img{width:100%;max-height:60dvh;object-fit:contain}
.qdetail-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  margin-block-end:16px}
.qdetail-head h3{margin:0;flex:none}
.qdetail-close{margin-inline-start:auto;padding:6px 14px;font-size:13.5px}
.verdict{font-size:13.5px;padding:4px 12px;border-radius:999px}
.verdict.ok{background:var(--sage-050);color:var(--ink)}
.verdict.no,.verdict.blank{background:#F6EAE8;color:var(--ink)}
.verdict.skipped{background:var(--mist-deep);color:var(--muted)}

.review-opts{display:flex;flex-direction:column;gap:8px;margin-block-start:16px}
.review-opt{display:flex;align-items:center;gap:12px;padding:11px 14px;
  border:1px solid var(--line);border-radius:var(--r-sm);font-size:15px}
.review-opt-n{font-family:var(--num);color:var(--muted);flex:none;
  width:22px;text-align:center}
.review-opt-tag{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.review-opts.scan-opts{flex-direction:row;flex-wrap:wrap;gap:10px}
.scan-opts .review-opt{flex:0 0 auto;gap:8px;padding:9px 16px;border-radius:999px}
.scan-opts .review-opt-tag{margin-inline-start:0}
.review-opt.right{border-color:var(--sage);background:var(--sage-050)}
.review-opt.picked:not(.right){border-color:var(--clay);background:#F6EAE8}

/* ---- the busy overlay: something slow is happening ---------------------- */
.busy{position:fixed;inset:0;z-index:90;pointer-events:none;visibility:hidden;
  transition:visibility 0s linear .25s}
.busy[data-open=true]{pointer-events:auto;visibility:visible;transition-delay:0s}
.busy-scrim{position:absolute;inset:0;background:rgba(31,43,39,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .25s var(--ease)}
.busy[data-open=true] .busy-scrim{opacity:1}
.busy-card{position:absolute;inset-block-start:50%;inset-inline-start:50%;
  width:min(330px,86vw);padding:clamp(22px,3vw,30px);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);
  transform:translate(50%,-50%) scale(.94);opacity:0;
  transition:transform .28s var(--ease),opacity .28s var(--ease)}
[dir=ltr] .busy-card{transform:translate(-50%,-50%) scale(.94)}
.busy[data-open=true] .busy-card{opacity:1;transform:translate(50%,-50%) scale(1)}
[dir=ltr] .busy[data-open=true] .busy-card{transform:translate(-50%,-50%) scale(1)}
.busy-spinner{width:38px;height:38px;border-radius:50%;
  border:3px solid color-mix(in srgb,var(--ink) 14%,transparent);
  border-block-start-color:var(--accent,#2f6f5e);
  animation:busy-spin .8s linear infinite}
.busy-label{color:var(--muted);font-size:15px;line-height:1.6;margin:0}
@keyframes busy-spin{to{transform:rotate(360deg)}}
/* A spinner that cannot be stilled is worse than none for anyone who needs
   motion reduced, so it steps instead of sweeping. */
@media (prefers-reduced-motion:reduce){
  .busy-spinner{animation-duration:2.4s;animation-timing-function:steps(8,end)}
  .busy-scrim,.busy-card{transition:none}
}

/* ---- the source drawer: the passage or chart, parked at the edge --------- */
.source-tab{
  position:fixed;inset-inline-end:0;inset-block-start:50%;z-index:55;
  display:flex;align-items:center;gap:9px;
  padding:16px 18px;cursor:pointer;font:inherit;font-size:14.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-inline-end:0;
  border-start-start-radius:var(--r-md);border-end-start-radius:var(--r-md);
  box-shadow:var(--shadow);
  transform:translateY(-50%);
  transition:background .28s var(--ease),box-shadow .28s var(--ease),
             padding-inline-end .28s var(--ease);
  animation:tab-in .5s var(--ease) both .25s;
}
.source-tab:hover{background:var(--sage-050);box-shadow:var(--shadow-lift);padding-inline-end:26px}
.source-tab:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
.source-chevron{
  width:7px;height:7px;border-inline-start:1.5px solid var(--sage);
  border-block-start:1.5px solid var(--sage);transform:rotate(-45deg);
  transition:transform .3s var(--ease)}
.source-tab:hover .source-chevron{transform:rotate(-45deg) translate(2px,-2px)}
@keyframes tab-in{from{opacity:0;transform:translateY(-50%) translateX(-14px)}
                  to{opacity:1;transform:translateY(-50%)}}

.source{position:fixed;inset:0;z-index:70;pointer-events:none;visibility:hidden;
  transition:visibility 0s linear .45s}
.source[data-open=true]{pointer-events:auto;visibility:visible;transition-delay:0s}
.source-scrim{position:absolute;inset:0;background:rgba(31,43,39,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .4s var(--ease)}
.source[data-open=true] .source-scrim{opacity:1}

.source-panel{
  position:absolute;inset-block:0;inset-inline-end:0;width:min(880px,94vw);
  display:flex;flex-direction:column;gap:0;
  background:var(--surface);box-shadow:var(--shadow-lift);
  --slide:100%;
  transform:translateX(var(--slide));
  transition:transform .44s var(--ease)}
[dir=rtl] .source-panel{--slide:-100%}
.source[data-open=true] .source-panel{transform:translateX(0)}

.source-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px clamp(16px,2vw,26px);border-block-end:1px solid var(--line);flex:0 0 auto}
.source-head h3{font-size:21px}
.source-shut{background:transparent;border:1px solid var(--line);border-radius:50%;
  width:34px;height:34px;cursor:pointer;color:var(--muted);line-height:1;
  transition:background .22s var(--ease),color .22s var(--ease),transform .22s var(--ease)}
.source-shut:hover{background:var(--sage-050);color:var(--ink);transform:rotate(90deg)}
.source-panel .passage{padding:clamp(16px,2vw,26px);margin:0;flex:1 1 auto;
  opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease) .12s,
  transform .4s var(--ease) .12s}
.source[data-open=true] .source-panel .passage{opacity:1;transform:none}
@media (max-width:720px){.source-tab{padding:13px 14px;font-size:13.5px}}
.scan .options{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block-start:18px}
.scan .opt{grid-template-columns:22px auto;justify-content:center;align-items:center;
  font-size:19px;padding-block:14px}
@media (max-width:720px){.scan-img{max-height:60dvh}.scan .opt{font-size:17px}}

.card{background:var(--surface);border-radius:var(--r-lg);padding:clamp(22px,2.8vw,38px);
  box-shadow:var(--shadow)}
.card h3{font-size:24px;letter-spacing:.015em;margin-bottom:14px;color:var(--ink)}
/* who is signed in, and the way out */
.account{display:flex;align-items:center;justify-content:flex-end;gap:14px;
  font-size:13.5px;color:var(--muted);margin-block-end:-6px;
  padding:8px 16px;border-radius:999px;justify-self:end;width:auto;
  background:color-mix(in srgb,var(--surface) 66%,transparent);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  backdrop-filter:blur(6px)}
.account-out{color:var(--muted);text-decoration:none;border-block-end:1px solid var(--line);
  transition:color .2s var(--ease),border-color .2s var(--ease)}
.account-out:hover{color:var(--ink);border-color:var(--sage)}

/* booklets already extracted: uploading 6 MB twice is nobody's idea of a feature */
.library-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.library-list li{display:flex;align-items:stretch;gap:8px}
.library-open{flex:1;display:flex;align-items:center;justify-content:space-between;
  gap:14px;text-align:start;cursor:pointer;
  background:color-mix(in srgb,var(--surface) 70%,transparent);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 16px;font:inherit;color:var(--ink);
  transition:background .22s var(--ease),border-color .22s var(--ease),
    box-shadow .22s var(--ease)}
.library-open b{font-weight:500}
.library-open .tag{margin:0;flex:none}
.library-open:hover{background:var(--sage-050);border-color:var(--sage-100);
  box-shadow:var(--shadow)}
.library-drop{width:42px;border:1px solid transparent;border-radius:var(--r-md);
  background:transparent;color:var(--muted);cursor:pointer;font-size:15px;opacity:.4;
  transition:background .22s var(--ease),color .22s var(--ease),
    opacity .22s var(--ease),border-color .22s var(--ease)}
.library-list li:hover .library-drop,.library-drop:focus-visible{opacity:1;
  border-color:var(--line)}
.library-drop:hover{background:#FBEFE9;color:#8A4B39}
.library-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-block-start:14px;padding-block-start:12px;border-block-start:1px solid var(--line)}
.library-pager .btn{padding:7px 16px;font-size:14px}
.library-pager .btn:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
.library-pager .tag{margin:0}

/* an interrupted sitting, offered back */
.card.resume{display:flex;align-items:center;justify-content:space-between;gap:20px;
  flex-wrap:wrap;border:1px solid var(--sage-100);background:var(--sage-050);
  animation:rise .42s var(--ease) both}
.resume-actions{display:flex;gap:10px;flex-wrap:wrap}

.passage{max-height:min(58dvh,660px);overflow:auto;font-family:var(--read);
  font-size:16.5px;line-height:1.9;font-weight:400;color:#2D3D39;
  scrollbar-width:thin;scrollbar-color:var(--sage-100) transparent}
.passage::-webkit-scrollbar{width:6px}
.passage::-webkit-scrollbar-thumb{background:var(--sage-100);border-radius:3px}
.passage p{margin:0 0 1.15em}
.passage[dir=ltr]{text-align:left}
.passage table{border-collapse:separate;border-spacing:0;width:100%;font-family:var(--sans);font-size:13.5px}
.passage th,.passage td{border-block-end:1px solid var(--line);padding:9px 8px;text-align:center}
.passage thead th,.passage tbody th{background:var(--sage-050);font-weight:500;color:var(--ink)}

.instruction{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 16px}
.stem{font-family:var(--read);font-weight:400;font-size:clamp(18px,2vw,21px);
  line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.stem[dir=ltr]{text-align:left}

/* answers */
.options{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:26px 1fr;align-items:start;gap:15px;
  width:100%;text-align:start;background:transparent;border:1px solid var(--line);
  border-radius:var(--r-md);padding:15px 18px;cursor:pointer;font-weight:300;
  transition:background .22s var(--ease),border-color .22s var(--ease),transform .18s var(--ease)}
.opt:hover{background:var(--sage-050);border-color:var(--sage-100)}
.opt:active{transform:scale(.995)}
.opt:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.opt[aria-checked=true]{background:var(--sage-050);border-color:var(--sage)}
.opt[dir=ltr]{text-align:left}
.pip{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  margin-block-start:3px;display:grid;place-items:center;
  transition:border-color .22s var(--ease)}
.pip::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--sage);
  transform:scale(0);transition:transform .26s cubic-bezier(.34,1.56,.64,1)}
.opt[aria-checked=true] .pip{border-color:var(--sage)}
.opt[aria-checked=true] .pip::after{transform:scale(1)}
.label{padding-block-start:1px;line-height:1.55}

/* controls */
.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;
  padding:clamp(22px,3vw,34px) var(--pad)}
.btn{border:0;border-radius:999px;background:var(--sage);color:#fff;font-weight:400;
  padding:13px 34px;cursor:pointer;letter-spacing:.01em;
  box-shadow:0 1px 2px rgba(36,51,48,.06),0 10px 22px -14px rgba(111,157,134,.9);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.btn:hover{background:#628E79;transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:none}
.btn.quiet:hover{background:var(--mist-deep);color:var(--ink);transform:none;box-shadow:none}
.hint{font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--num);font-size:11.5px;background:var(--mist-deep);border-radius:5px;
  padding:2px 7px;color:var(--muted)}

/* full-bleed calm screens */
.bleed{min-height:100dvh;background:var(--deep);color:#E9EFEB;
  display:grid;place-content:center;justify-items:center;gap:24px;
  padding:var(--pad);text-align:center}
.bleed .tag{color:#8CA096}
.bleed h1{color:#F1F5F2}
.bleed .btn{background:transparent;color:#C9D6CF;box-shadow:none;border:1px solid #3B4C45}
.bleed .btn:hover{background:#2A3A34;color:#F1F5F2;transform:none}
.big{font-family:var(--num);font-weight:300;font-size:clamp(52px,13vw,110px);
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr}

/* the break screen breathes — four seconds in, four seconds out */
.breath-wrap{position:relative;display:grid;place-items:center;width:min(320px,68vw);aspect-ratio:1}
.breath{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(111,157,134,.32), rgba(111,157,134,0) 70%);
  animation:breathe 8s ease-in-out infinite}
.breath.b2{animation-delay:-.9s;opacity:.55}
@keyframes breathe{0%,100%{transform:scale(.72)}50%{transform:scale(1)}}
.breath-inner{position:relative;display:grid;gap:8px;justify-items:center}

/* writing */
textarea{width:100%;min-height:44dvh;resize:vertical;padding:24px 26px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  font-family:var(--read);font-weight:400;font-size:17px;line-height:2.05;color:var(--ink);
  box-shadow:var(--shadow);transition:border-color .22s var(--ease)}
textarea:focus{outline:none;border-color:var(--sage-100)}
.meter{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted);
  justify-content:center;padding-block-start:4px}
.meter b{font-family:var(--num);font-weight:400;color:var(--ink)}
.meter .short b{color:var(--clay)}

/* setup + results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.stat .v{font-family:var(--num);font-weight:300;font-size:33px;line-height:1.25;margin-block-start:2px;
  font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:300}

.drop{border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:34px;text-align:center;cursor:pointer;
  transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease)}
.drop:hover{border-color:var(--sage-100)}
.drop.over{border-color:var(--sage);background:var(--sage-050);transform:scale(1.008)}
.drop b{font-weight:500}
.field{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block-start:16px;font-size:15px}
select,input[type=text]{padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-weight:300}
select:focus,input:focus{outline:none;border-color:var(--sage-100)}
.notice{border-radius:var(--r-md);background:var(--sage-050);padding:16px 20px;font-size:14.5px;
  line-height:1.6;border-inline-start:2px solid var(--sage)}
.notice.warn{background:#FAF0EE;border-inline-start-color:var(--clay)}
.notice ul{margin:8px 0 0;padding-inline-start:20px}

table.review{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface);
  border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
table.review th,table.review td{border-block-end:1px solid var(--line);padding:12px 14px;text-align:start}
table.review tr:last-child td{border-block-end:0}
table.review th{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.03em}
td.n{font-family:var(--num);font-variant-numeric:tabular-nums}
/* Scoped to the review table: a bare `.dot` also matches the topbar's
   `.tag.dot` separator and would force its 7px width onto every label. */
td.n .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:9px}
td.n .dot.ok{background:var(--sage)} td.n .dot.no{background:var(--clay)}
td.n .dot.na{background:var(--line)}

/* motion */
.options .opt{animation:rise .4s var(--ease) both}
.options .opt:nth-child(1){animation-delay:.10s} .options .opt:nth-child(2){animation-delay:.16s}
.options .opt:nth-child(3){animation-delay:.22s} .options .opt:nth-child(4){animation-delay:.28s}
.enter{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .42s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s} .stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s} .stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s} .stagger>*:nth-child(6){animation-delay:.27s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
