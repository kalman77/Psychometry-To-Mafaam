<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מפע״ם — הרצת בחינה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&family=Bellefair&family=Noto+Serif+Hebrew:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* a quiet room: desaturated eucalyptus and warm paper, nothing that raises a pulse */
  --mist:#EDF1EE; --mist-deep:#E3EAE5; --surface:#FCFDFC;
  --ink:#243330; --muted:#79877F; --line:#DFE7E2;
  --sage:#6F9D86; --sage-050:#E6EFE9; --sage-100:#CFE0D6;
  --sand:#D5B074; --clay:#C48C82;
  --deep:#1F2B27;

  --display:"Bellefair",Georgia,serif;
  --sans:"Rubik","Segoe UI",system-ui,sans-serif;
  --read:"Noto Serif Hebrew",Georgia,serif;
  --num:"Outfit","Rubik",system-ui,sans-serif;

  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(36,51,48,.04), 0 18px 40px -24px rgba(36,51,48,.22);
  --shadow-lift:0 2px 4px rgba(36,51,48,.05), 0 28px 56px -28px rgba(36,51,48,.28);
  --ease:cubic-bezier(.22,.8,.28,1);
  --pad:clamp(20px,4vw,44px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--mist);color:var(--ink);
  font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,5.4vw,54px)}

/* the journey rail: the whole sitting at a glance, so time is never a surprise */
#rail{position:fixed;inset-block-start:0;inset-inline:0;height:2px;background:var(--mist-deep);z-index:60}
#rail i{display:block;height:100%;width:0;background:var(--sage-100);transition:width .6s var(--ease)}

/* the time dial: one question's clock, unwinding */
#dial{
  position:fixed;inset-block-start:16px;left:16px;z-index:61;
  width:76px;height:76px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
#dial.hidden{opacity:0;transform:scale(.9);pointer-events:none}
#dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#dial circle{fill:none;stroke-width:2.5;stroke-linecap:round}
#dial .track{stroke:var(--sage-050)}
#dial .arc{stroke:var(--sage);transition:stroke .9s linear}
#dial.warm .arc{stroke:var(--sand)} #dial.late .arc{stroke:var(--clay)}
#dial b{font-family:var(--num);font-weight:400;font-size:16px;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;direction:ltr;color:var(--ink);transition:color .9s linear}
#dial.late b{color:var(--clay)}
@media (max-width:720px){#dial{width:60px;height:60px;inset-block-start:10px;left:10px}#dial b{font-size:14px}}

/* shell */
.stage{min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:26px var(--pad) 0;justify-content:center}
.tag{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:400}
.tag.dot::before{content:'';display:inline-block;width:3px;height:3px;border-radius:50%;
  background:var(--sage-100);margin-inline-end:10px;vertical-align:middle}

.sheet{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:22px var(--pad) 0;
  display:grid;gap:clamp(16px,2.4vw,26px);align-content:start}
.sheet.split{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:start}
@media (max-width:940px){.sheet.split{grid-template-columns:1fr}}
.sheet.narrow{max-width:760px}

.card{background:var(--surface);border-radius:var(--r-lg);padding:clamp(22px,2.8vw,38px);
  box-shadow:var(--shadow)}
.card h3{font-size:24px;letter-spacing:.015em;margin-bottom:14px;color:var(--ink)}

.passage{max-height:min(58dvh,660px);overflow:auto;font-family:var(--read);
  font-size:16.5px;line-height:1.9;font-weight:400;color:#2D3D39;
  scrollbar-width:thin;scrollbar-color:var(--sage-100) transparent}
.passage::-webkit-scrollbar{width:6px}
.passage::-webkit-scrollbar-thumb{background:var(--sage-100);border-radius:3px}
.passage p{margin:0 0 1.15em}
.passage[dir=ltr]{text-align:left}
.passage table{border-collapse:separate;border-spacing:0;width:100%;font-family:var(--sans);font-size:13.5px}
.passage th,.passage td{border-block-end:1px solid var(--line);padding:9px 8px;text-align:center}
.passage thead th,.passage tbody th{background:var(--sage-050);font-weight:500;color:var(--ink)}

.instruction{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 16px}
.stem{font-family:var(--read);font-weight:400;font-size:clamp(18px,2vw,21px);
  line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.stem[dir=ltr]{text-align:left}

/* answers */
.options{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:26px 1fr;align-items:start;gap:15px;
  width:100%;text-align:start;background:transparent;border:1px solid var(--line);
  border-radius:var(--r-md);padding:15px 18px;cursor:pointer;font-weight:300;
  transition:background .22s var(--ease),border-color .22s var(--ease),transform .18s var(--ease)}
.opt:hover{background:var(--sage-050);border-color:var(--sage-100)}
.opt:active{transform:scale(.995)}
.opt:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.opt[aria-checked=true]{background:var(--sage-050);border-color:var(--sage)}
.opt[dir=ltr]{text-align:left}
.pip{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  margin-block-start:3px;display:grid;place-items:center;
  transition:border-color .22s var(--ease)}
.pip::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--sage);
  transform:scale(0);transition:transform .26s cubic-bezier(.34,1.56,.64,1)}
.opt[aria-checked=true] .pip{border-color:var(--sage)}
.opt[aria-checked=true] .pip::after{transform:scale(1)}
.label{padding-block-start:1px;line-height:1.55}

/* controls */
.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;
  padding:clamp(22px,3vw,34px) var(--pad)}
.btn{border:0;border-radius:999px;background:var(--sage);color:#fff;font-weight:400;
  padding:13px 34px;cursor:pointer;letter-spacing:.01em;
  box-shadow:0 1px 2px rgba(36,51,48,.06),0 10px 22px -14px rgba(111,157,134,.9);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.btn:hover{background:#628E79;transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:none}
.btn.quiet:hover{background:var(--mist-deep);color:var(--ink);transform:none;box-shadow:none}
.hint{font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--num);font-size:11.5px;background:var(--mist-deep);border-radius:5px;
  padding:2px 7px;color:var(--muted)}

/* full-bleed calm screens */
.bleed{min-height:100dvh;background:var(--deep);color:#E9EFEB;
  display:grid;place-content:center;justify-items:center;gap:24px;
  padding:var(--pad);text-align:center}
.bleed .tag{color:#8CA096}
.bleed h1{color:#F1F5F2}
.bleed .btn{background:transparent;color:#C9D6CF;box-shadow:none;border:1px solid #3B4C45}
.bleed .btn:hover{background:#2A3A34;color:#F1F5F2;transform:none}
.big{font-family:var(--num);font-weight:300;font-size:clamp(52px,13vw,110px);
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr}

/* the break screen breathes — four seconds in, four seconds out */
.breath-wrap{position:relative;display:grid;place-items:center;width:min(320px,68vw);aspect-ratio:1}
.breath{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(111,157,134,.32), rgba(111,157,134,0) 70%);
  animation:breathe 8s ease-in-out infinite}
.breath.b2{animation-delay:-.9s;opacity:.55}
@keyframes breathe{0%,100%{transform:scale(.72)}50%{transform:scale(1)}}
.breath-inner{position:relative;display:grid;gap:8px;justify-items:center}

/* writing */
textarea{width:100%;min-height:44dvh;resize:vertical;padding:24px 26px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  font-family:var(--read);font-weight:400;font-size:17px;line-height:2.05;color:var(--ink);
  box-shadow:var(--shadow);transition:border-color .22s var(--ease)}
textarea:focus{outline:none;border-color:var(--sage-100)}
.meter{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted);
  justify-content:center;padding-block-start:4px}
.meter b{font-family:var(--num);font-weight:400;color:var(--ink)}
.meter .short b{color:var(--clay)}

/* setup + results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.stat .v{font-family:var(--num);font-weight:300;font-size:33px;line-height:1.25;margin-block-start:2px;
  font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:300}

.drop{border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:34px;text-align:center;cursor:pointer;
  transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease)}
.drop:hover{border-color:var(--sage-100)}
.drop.over{border-color:var(--sage);background:var(--sage-050);transform:scale(1.008)}
.drop b{font-weight:500}
.field{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block-start:16px;font-size:15px}
select,input[type=text]{padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-weight:300}
select:focus,input:focus{outline:none;border-color:var(--sage-100)}
.notice{border-radius:var(--r-md);background:var(--sage-050);padding:16px 20px;font-size:14.5px;
  line-height:1.6;border-inline-start:2px solid var(--sage)}
.notice.warn{background:#FAF0EE;border-inline-start-color:var(--clay)}
.notice ul{margin:8px 0 0;padding-inline-start:20px}

table.review{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface);
  border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
table.review th,table.review td{border-block-end:1px solid var(--line);padding:12px 14px;text-align:start}
table.review tr:last-child td{border-block-end:0}
table.review th{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.03em}
td.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:9px}
.dot.ok{background:var(--sage)} .dot.no{background:var(--clay)} .dot.na{background:var(--line)}

/* motion */
.options .opt{animation:rise .4s var(--ease) both}
.options .opt:nth-child(1){animation-delay:.10s} .options .opt:nth-child(2){animation-delay:.16s}
.options .opt:nth-child(3){animation-delay:.22s} .options .opt:nth-child(4){animation-delay:.28s}
.enter{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .42s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s} .stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s} .stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s} .stagger>*:nth-child(6){animation-delay:.27s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>

<div id="rail"><i></i></div>
<div id="dial" class="hidden">
  <svg viewBox="0 0 76 76"><circle class="track" cx="38" cy="38" r="33"/><circle class="arc" id="arc" cx="38" cy="38" r="33"/></svg>
  <b id="clock">0:00</b>
</div>

<script>window.EXAMPLE_BANK = {"meta":{"id":"nite-winter-2023-excerpt","title":"בחינה פסיכומטרית להתנסות — מועד חורף 2023","language":"he","note":"קטע קצר מן המבחן המלא, לצורך הדגמת המבנה. השלימו את שאר הפריטים באותו פורמט."},"writingTask":{"minutes":30,"minLines":25,"intro":"קראו בעיון את המטלה וכתבו חיבור. אורך החיבור הנדרש — 25 שורות לפחות. כתבו בעברית בלבד, בסגנון ההולם כתיבה עיונית, והקפידו על ארגון הכתוב ועל לשון תקינה ובהירה.","prompt":"בשנים האחרונות חלה עלייה ניכרת במספר רוכבי האופניים בערים הגדולות. החוק אוסר על רוכבי אופניים לרכוב על המדרכות מחשש שיפגעו בהולכי רגל. ואולם, רוכבי האופניים טוענים שהרכיבה על הכביש מסוכנת מאוד, והם דורשים כי בכל מקום שאין בו שביל ייעודי לאופניים תותר הרכיבה על המדרכה.\n\nלדעתכם, האם יש להתיר לרוכבי האופניים בערים הגדולות לרכוב על המדרכות במקומות שאי אפשר לסלול בהם שבילים ייעודיים לאופניים? נמקו."},"sections":[{"id":"v1","domain":"verbal","title":"חשיבה מילולית — פרק ראשון","subtitle":"אנלוגיות, שאלות הבנה והסקה, שאלות על קטע קריאה","stimuli":[{"id":"v1p1","kind":"reading_passage","title":"קטע קריאה — קטשופ","body":"כאשר שכרה חברת המזון קמפבל בשנת 1986 את האוורד מוסקוביץ' כדי לפתח עבורה רוטב עגבניות לפסטה, רווחה הסברה שלכל מאכל יש מתכון מושלם, המשלב באופן כה מוצלח בין מרכיביו, עד שכל מי שיטעם ממנו יתאהב בו מייד. מוסקוביץ', דוקטור לפסיכופיזיקה, ניגש למטלה בעזרת ארגז כלים מדעי: הוא הרכיב ארבעים וחמש גרסאות של רוטב עגבניות, וביקש מקבוצות של טועמים לדרג אותן. הממצאים שהתקבלו נראו מבלבלים: במקום להצביע כמצופה על רוטב אחד ויחיד האהוב על כולם, הם לא הראו כל דפוס עקיב. אלא שניתוח מדוקדק העלה מסקנה מורכבת יותר: הטועמים נחלקו לקבוצות שלכל אחת הרוטב המושלם שלה, וככל שגרסה מסוימת מצאה חן יותר בעיני חברי קבוצה אחת, כך היא נשאה חן פחות בעיני חברי הקבוצות האחרות. בכל הנוגע למזון, טען אפוא מוסקוביץ', הרדיפה אחר האוניברסלי מיותרת, מפני שהוא כלל אינו קיים.\n\nטענתו של מוסקוביץ' אומנם זכתה לחיזוק מניסויים במאכלים אחרים וחוללה שינוי דרמטי בעולם המזון התעשייתי, אך מוצר מזון אחד מכשיל אותה שוב ושוב. למרות ניסיונות רבים של חברות מזון לייצר קטשופ מסוגים שונים, רובנו עדיין מעדיפים קטשופ הדומה מאוד לזה שהופיע בראשית המאה ה־20. בשלהי המאה ה־19 טען משרד החקלאות האמריקני שבנזואט, החומר המשמר בקטשופ של אותם ימים, מסוכן לבריאות. בעקבות זאת התפלגו יצרני הקטשופ לשניים: האגף השמרני טען שאין כל סכנה בצריכת בנזואט בכמויות קטנות, והמשיך לייצר קטשופ כפי שהיה נהוג עד אז, מעגבניות בוסר ומכמות קטנה בלבד של חומץ, שעשוהו דליל ומימי. מנגד ניצבו אלו שטענו כי מצאו דרך להחליף את הבנזואט: הם הגדילו מאוד את כמות החומץ בקטשופ, במידה כזו שיוכל לשמש חומר משמר, ואגב כך גם עברו להשתמש בעגבניות בשלות, והתוצאה הייתה רוטב סמיך ועשיר בטעמים. ההימור השתלם: למרות מחירו הזול, נעלם קטשופ הבנזואט מן העולם."}],"items":[{"id":"v1-1","type":"analogy","instruction":"מצאו את היחס בין המשמעויות של שתי המילים המודגשות, ובחרו את זוג המילים שהיחס ביניהן דומה לו ביותר.","stem":"עוגן : להפליג —","options":["תריס : להחשיך","קשר : להתיר","מפתח : לנעול","פקק : למזוג"],"answer":4},{"id":"v1-2","type":"analogy","stem":"מגהץ : חָלק —","options":["סרגל : ישר","כרית : רך","סולם : גבוה","מגבת : יבש"],"answer":4},{"id":"v1-7","type":"logic","stem":"יום שישי החל ב־13 בחודש נחשב בעיני רבים ליום מבשר רעות. מחקר שנערך בהולנד קובע שיום שישי כזה דווקא בטוח יותר מימי שישי אחרים: יש בו פחות תאונות, שרפות וגנבות. החוקרים הסבירו את הממצאים בכך שרבים מההולנדים מאמינים שיום שישי כזה מועד לאסונות, ונוטים להיות זהירים בו יותר ולמעט ביציאה מבתיהם.\n\nאיזו מהתופעות הבאות היא הדומה ביותר לתופעה המתוארת לעיל?","options":["סקי הוא ענף ספורט מסוכן, הגורם לפציעות רבות בקרב גולשים לא מקצועיים, אך גולשי סקי מקצועיים נפצעים לעיתים רחוקות בלבד","סטודנטים נוטים להצליח יותר במבחנים שהם חוששים שייכשלו בהם, מכיוון שהם משקיעים זמן רב יותר בלימוד לקראתם","אנשים החוששים מכלבים וניגשים אליהם בזהירות יתרה מעוררים את חשדם של הכלבים ובכך גורמים להם להיות תוקפניים יותר כלפיהם","הגדלת מספר השוטרים ברחובות מסייעת בצמצום הפשיעה בשעות הלילה יותר משהיא מסייעת בצמצום הפשיעה בשעות היום"],"answer":2},{"id":"v1-10","type":"sentence_completion","instruction":"בחרו את התשובה המתאימה ביותר להשלמת החסר.","stem":"______ להפעיל לחץ על עובד כדי ש______ החלטתו, אם החליט לפרוש מתפקידו; זאת ______ שארגון שאינו ______, נידון מראש לכישלון.","options":["יש / יממש את / מכיוון / עושה כל שביכולתו כדי להימנע מתחלופת עובדים","יש / ישנה את / משום / שם לעצמו כיעד לצמצם ככל האפשר את תחלופת העובדים","אין / יחזור בו מ־ / אף על פי / מאפשר חופש בחירה לעובדיו","יש / יממש את / אף על פי / מעסיק אך ורק עובדים המעוניינים בתפקידם"],"answer":2},{"id":"v1-18","type":"reading_question","stimulusId":"v1p1","stem":"רועי ומיכל שמעו על הטענה של מוסקוביץ' וטענו שהעדפותיהם בנוגע לסלט יכולות להיחשב עדות שתחזק אותה. איזו מן האפשרויות הבאות היא המתאימה ביותר לתיאור העדפותיהם?","options":["רועי נוהג לאכול סלט עם עגבניות שרי, ואילו מיכל מעדיפה להכין סלט שאינו מכיל עגבניות כאלו, בשל מחירן היקר","רועי אוהב סלט המכיל גזר, ואילו מיכל טוענת שטעמו המתוק פוגם בטעמו החמצמץ של הסלט החביב עליה","רועי ומיכל מסכימים שניהם שהוספת שמיר לסלט תפגע בטעמו, אלא אם כן יש בסלט גם כוסברה","רועי אוהב סלט המכיל אגוזים, ומיכל, שהייתה בתחילה ספקנית, משוכנעת מאז שטעמה ממנו שהאגוזים הם תוספת הכרחית לכל סלט"],"answer":2},{"id":"v1-19","type":"reading_question","stimulusId":"v1p1","stem":"איזו מן האפשרויות הבאות עולה מן הפסקה השנייה בנוגע לטענתו של משרד החקלאות האמריקני כי הבנזואט מסוכן לבריאות?","options":["הטענה נמצאה נכונה","הטענה הביאה לפיתוחו של הקטשופ המוכר לנו כיום","הטענה הובילה לאיסור על השימוש בבנזואט כחומר משמר","הטענה הועלתה עוד בטרם הומצא הקטשופ"],"answer":2}]},{"id":"q2","domain":"quantitative","title":"חשיבה כמותית — פרק שני","subtitle":"שאלות ובעיות, הסקה מטבלה","stimuli":[{"id":"q2t1","kind":"figure","title":"הסקה מטבלה — מטע שזיפים","body":"בטבלה מוצגים נתונים שנרשמו בסוף שנת 2020 על פירות הנגועים במזיקים במטע שזיפים. עצי השזיף נטועים ב־7 חלקות (א–ז). בכל טור נטועים 4 עצים, אחד מכל זן: A, B, C, D. עבור כל זן רשום אחוז הפירות הנגועים בכל חלקה. הניחו שלכל עץ מספר שווה של שזיפים.","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth>שם החלקה\u003c/th>\u003cth>א\u003c/th>\u003cth>ב\u003c/th>\u003cth>ג\u003c/th>\u003cth>ד\u003c/th>\u003cth> s":["A","B","C","D"],"answer":2}]},{"id":"e1","domain":"english","title":"English — Section One","subtitle":"Sentence Completions, Restatements, Reading Comprehension","stimuli":[{"id":"e1p1","kind":"reading_passage","title":"Text I — Unusual Post Offices","body":"In today's world of fast, efficient communication such as email and WhatsApp, why would anyone bother with stamps and envelopes? Indeed, \"snail mail\" — as the regular postal system is often called — may eventually become obsolete. Some post offices have radically streamlined the services they provide or have closed altogether. However, a few are flourishing — thanks to their surprising locations.\n\nOne of the most unusual post offices is found in Vanuatu, a country comprising many islands in the South Pacific Ocean. Located in Hideaway Island Marine Sanctuary, the world's first underwater post office lies fifty meters offshore and three meters below the water's surface. A flag flown above the site announces when the postal workers — trained divers who swim to work wearing scuba equipment — are on duty. An estimated 100,000 tourists have used the post office since its opening in 2003. Visitors who choose to dive can purchase waterproof postcards on shore and swim out to mail them (non-divers have the option of placing them in a mailbox located in a hotel). Vanuatu Post encourages visitors to literally look below the surface.\n\nAnother postal facility that owes its fame to its location is the Penguin Post Office, the most popular tourist attraction in Antarctica. Run by the United Kingdom Antarctic Heritage Trust, the world's southernmost post office is situated at Port Lockroy, on tiny Wiencke Island, 1100 kilometers from the tip of South America. The post office operates only during the four months of summer, when thousands of tourists arrive on cruise ships. The four-person staff is replaced every year. Despite the remote location, cold weather, minimal salary, and crude living conditions, more than fifty people eagerly apply each year to the Heritage Trust for the privilege of undergoing this singular experience.","dir":"ltr"}],"items":[{"id":"e1-1","type":"sentence_completion","dir":"ltr","stem":"Jackals can live up to 10 years in the wild and up to 16 years in _____.","options":["anxiety","severity","captivity","royalty"],"answer":3},{"id":"e1-2","type":"sentence_completion","dir":"ltr","stem":"Landscape architect Hoichi Kurisu _____ nearly two years of his life to designing the Morikami Museum and Japanese Gardens in Delray Beach, Florida.","options":["devoted","exposed","composed","obeyed"],"answer":1},{"id":"e1-9","type":"restatement","dir":"ltr","instruction":"Choose the restatement which best expresses the meaning of the original sentence.","stem":"Katie Mulcahey was the only person fined for violating a short-lived 1908 New York City ordinance that prohibited women from smoking in public.","options":["New York City's 1908 ban against women smoking in public was overturned shortly after Katie Mulcahey was fined for violating the law.","Katie Mulcahey was the first person – but not the last – to defy a New York City law that made it illegal for women to smoke in public.","In 1908, Katie Mulcahey was fined for protesting against a New York City regulation barring women from smoking in public.","During the brief time that New York City banned women from smoking in public, just one person – Katie Mulcahey – was fined for breaking the law."],"answer":4},{"id":"e1-13","type":"reading_question","stimulusId":"e1p1","dir":"ltr","stem":"What do the two post offices described in the text have in common?","options":["They are in convenient locations.","They provide a unique experience.","They may soon have to close.","They have streamlined their services."],"answer":2},{"id":"e1-14","type":"reading_question","stimulusId":"e1p1","dir":"ltr","stem":"In line 3, \"become obsolete\" is closest in meaning to -","options":["greatly improve","no longer exist","spread to new   function toUniform(domain, raw) {
    const table = SCALE[domain];
    return table[Math.max(0, Math.min(table.length - 1, raw))];
  }
  function toGeneralScore(weighted) {
    const w = Math.max(50, Math.min(150, weighted));
    for (const [lo, hi, generalLo, generalHi] of GENERAL_BANDS) {
      if (w > hi) continue;
      if (lo === hi) return generalLo;
      const t = Math.max(0, Math.min(1, (w - lo) / (hi + 1 - lo)));
      return Math.round(generalLo + t * (generalHi - generalLo));
    }
    return GENERAL_BANDS[GENERAL_BANDS.length - 1][3];
  }
  function score(sitting, responses) {
    const raw = { verbal: 0, quantitative: 0, english: 0 };
    const attempted = { verbal: 0, quantitative: 0, english: 0 };
    const detail = [];
    for (const step of sitting.steps) {
      if (step.kind !== "item") continue;
      const given = responses[step.itemId] ?? null;
      const correct = given === step.answer;
      if (step.scored) {
        attempted[step.domain]++;
        if (correct) raw[step.domain]++;
      }
      detail.push({
        itemId: step.itemId,
        domain: step.domain,
        type: step.type,
        given,
        answer: step.answer,
        correct,
        scored: step.scored
      });
    }
    const V = toUniform("verbal", raw.verbal);
    const Q = toUniform("quantitative", raw.quantitative);
    const E = toUniform("english", raw.english);
    const composites = {
      multi: (2 * V + 2 * Q + E) / 5,
      verbalEmphasis: (3 * V + Q + E) / 5,
      quantEmphasis: (3 * Q + V + E) / 5
    };
    return {
      raw,
      attempted,
      uniform: { verbal: V, quantitative: Q, english: E },
      composites,
      general: {
        multi: toGeneralScore(composites.multi),
        verbalEmphasis: toGeneralScore(composites.verbalEmphasis),
        quantEmphasis: toGeneralScore(composites.quantEmphasis)
      },
      detail
    };
  }

        <div class="big" id="bigclock">${formatDuration(step.seconds)}</div>
        <p class="tag" style="color:#6E8278">\u05E0\u05E9\u05DE\u05D5 \u05D9\u05D7\u05D3 \u05E2\u05DD \u05D4\u05DE\u05E2\u05D2\u05DC</p>
      </div>
    </div>
    <p style="color:#8CA096;margin:0">\u05D4\u05D1\u05D7\u05D9\u05E0\u05D4 \u05EA\u05DE\u05E9\u05D9\u05DA \u05DE\u05E2\u05E6\u05DE\u05D4 \u05DB\u05E9\u05D4\u05D4\u05E4\u05E1\u05E7\u05D4 \u05EA\u05E1\u05EA\u05D9\u05D9\u05DD.</p>
    ${when(skippable, `<button class="btn" id="go">\u05DC\u05E7\u05E6\u05E8 \u05D0\u05EA \u05D4\u05D4\u05E4\u05E1\u05E7\u05D4</button>`)}
  </div>`;
  }
  function renderWriting(step) {
    return `
  <div class="stage">
    <div class="topbar"><span class="tag">\u05DE\u05D8\u05DC\u05EA \u05DB\u05EA\u05D9\u05D1\u05D4</span><span class="tag dot">${step.seconds / 60} \u05D3\u05E7\u05D5\u05EA</span></div>
    <div class="sheet narrow">
      <div class="card">
        ${when(step.intro, `<p class="instruction">${esc(step.intro)}</p>`)}
        <div class="stem">${esc(step.prompt)}</div>
      </div>
      <textarea id="essay" placeholder="\u05DB\u05EA\u05D1\u05D5 \u05DB\u05D0\u05DF\u2026" spellcheck="false"></textarea>
      <div class="meter">
        <span id="lw">\u05E9\u05D5\u05E8\u05D5\u05EA <b id="lines">0</b> \u05DE\u05EA\u05D5\u05DA ${step.minLines}</span>
        <span>\u05DE\u05D9\u05DC\u05D9\u05DD <b id="words">0</b></span>
      </div>
    </div>
    <div class="controls"><button class="btn" id="go">\u05E1\u05D9\u05D9\u05DE\u05EA\u05D9</button><span class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd></span></div>
  </div>`;
  }
  function renderStimulusBody(step, maxHeight) {
    const dir = step.dir ?? (isHebrew((step.body ?? "") + (step.title ?? "")) ? "rtl" : "ltr");
    return `<div class="passage" dir="${dir}" style="max-height:${maxHeight}">${step.html ?? ""}${step.body ? paragraphs(step.body) : ""}` + when(
      step.image,
      `<img src="${esc(step.image)}" alt="" style="max-width:100%;border-radius:var(--r-sm)">`
    ) + `</div>`;
  }
  function renderStimulus(step) {
    return `
  <div class="stage">
    <div class="topbar"><span class="tag">${esc(domainLabel(step.domain))}</span><span class="tag dot">\u05D6\u05DE\u05DF \u05E7\u05E8\u05D9\u05D0\u05D4 \xB7 ${Math.round(step.seconds / 60)} \u05D3\u05E7\u05D5\u05EA</span></div>
    <div class="sheet narrow"><div class="card"><h3>${esc(step.title)}</h3>${renderStimulusBody(step, "58dvh")}</div></div>
    <div class="controls"><button class="btn" id="go">\u05E7\u05E8\u05D0\u05EA\u05D9, \u05DC\u05E9\u05D0\u05DC\u05D5\u05EA</button><span class="hint"><kbd>Enter</kbd></span></div>
  </div>`;
  }
  function renderItem(vm) {
    const { step, stimulus } = vm;
    const dir = directionOf(step.dir, step.stem);
    const minutes = step.seconds % 60 ? (step.seconds / 60).toFixed(1) : step.seconds / 60;
    return `
  <div class="stage">
    <div class="topbar">
      <span class="tag">${esc(domainLabel(step.domain))}</span>
      <span class="tag dot">${esc(typeLabel(step.type))}</span>
      <span class="tag dot">${vm.position} \u05DE\u05EA\u05D5\u05DA ${vm.of}</span>
      <span class="tag dot">${minutes} \u05D3\u05E7\u05F3</span>
    </div>
    <div class="sheet${stimulus ? " split" : " narrow"}">
      ${when(
      stimulus,
      stimulus ? `<div class="card"><h3>${esc(stimulus.title)}</h3>${renderStimulusBody(stimulus, "54dvh")}</div>` : ""
    )}
      <div class="card">
        ${when(step.instruction, `<p class="instruction">${esc(step.instruction)}</p>`)}
        <div class="stem" dir="${dir}">${esc(step.stem)}</div>
        ${when(
      step.image,
      `<img src="${esc(step.image)}" alt="" style="max-width:100%;margin-block-start:20px;border-radius:var(--r-sm)">`
    )}
        <div class="options" role="radiogroup">
          ${step.options.map(
      (option, i) => `
            <button class="opt" role="radio" aria-checked="false" data-i="${i + 1}" dir="${dir}">
              <span class="pip"></span><span class="label">${esc(option)}</span>
            </button>`
    ).join("")}
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="go">\u05D4\u05DE\u05E9\u05DA</button>
      <span class="hint"><kbd>1</kbd>\u2013<kbd>4</kbd> \u05DC\u05D1\u05D7\u05D9\u05E8\u05D4 \xB7 <kbd>Enter</kbd> \u05DC\u05D4\u05DE\u05E9\u05DA</span>
    </div>
  </div>`;
  }

  // src/presentation/web/runner-controller.ts
  function once(fn) {
    let done = false;
    return () => {
      if (done) return;
      done = true;
      fn();
    };
  }
  var RunnerController = class {
    constructor(deps) {
      __publicField(this, "bank", null);
      __publicField(this, "sitting", null);
      __publicField(this, "cursor", 0);
      __publicField(this, "responses", {});
      __publicField(this, "spent", {});
      __publicField(this, "essay", "");
      __publicField(this, "config", defaultConfig());
      __publicField(this, "deps");
      this.deps = deps;
    }
    /** True while a sitting is under way — drives the "are you sure" guard. */
    isRunning() {
      const step = this.sitting?.steps[this.cursor];
      return !!step && step.kind !== "end";
    }
    start() {
      this.showSetup();
    }
    // -- setup ---------------------------------------------------------------
    showSetup(message = null) {
      const { screen, chrome, countdown } = this.deps;
      countdown.stop();
      chrome.showTime(0, 0, false);
      chrome.showProgress(0);
      this.sitting = null;
      const problems = this.bank ? validateBank(this.bank) : [];
      const preview = this.bank && !problems.length ? this.buildPreview() : null;
      screen.render(
        renderSetup({
          message,
          bank: this.bank ?? null,
          problems,
          preview,
          config: this.config,
          allowedMinutes: RULES.writing.allowedMinutes
        })
      );
      this.bindSetup();
    }
    buildPreview() {
      try {
        return this.deps.buildSitting.execute({ bank: this.bank, ...this.buildOptions() });
      } catch {
        return null;
      }
    }
    buildOptions() {
      return {
        blueprint: this.config.blueprint,
        seed: this.config.seed,
        writingMinutes: this.config.writingMinutes,
        includeWriting: this.config.includeWriting
      };
    }
    bindSetup() {
      const { screen } = this.deps;
      const drop = screen.byId("drop");
      const fileInput = screen.byId("file");
      if (drop && fileInput) {
        drop.onclick = () => fileInput.click();
        drop.ondragover = (event) => {
          event.preventDefault();
          drop.classList.add("over");
        };
        drop.ondragleave = () => drop.classList.remove("over");
        drop.ondrop = (event) => {
          event.preventDefault();
          drop.classList.remove("over");
          void this.loadFile(event.dataTransfer?.files[0]);
        };
        fileInput.onchange = () => void this.loadFile(fileInput.files?.[0]);
      }
      const demo = screen.byId("demo");
      if (demo)
        demo.onclick = () => {
          const example = this.deps.exampleBank ?? null;
          if (!example) return this.showSetup("\u05D0\u05D9\u05DF \u05D1\u05E0\u05E7 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05DE\u05D5\u05D8\u05DE\u05E2 \u05D1\u05E7\u05D5\u05D1\u05E5 \u05D4\u05D6\u05D4.");
          this.adoptBank(example);
        };
      const wmin = screen.byId("wmin");
      if (wmin)
        wmin.onchange = () => this.reconfigure({ writingMinutes: Number(wmin.value) });
      const bp = screen.byId("bp");
      if (bp) bp.onchange = () => this.reconfigure({ blueprint: bp.value });
      const seed = screen.byId("seed");
      if (seed) seed.onchange = () => this.reconfigure({ seed: seed.value });
      const skip = screen.byId("skipw");
      if (skip) skip.onchange = () => this.reconfigure({ includeWriting: !skip.checked });
      const start = screen.byId("start");
      if (start) start.onclick = () => this.begin();
    }
    reconfigure(patch) {
      this.config = { ...this.config, ...patch };
      this.showSetup();
    }
    async loadFile(file) {
      if (!file) return;
      try {
        this.adoptBank(await this.deps.bankFiles.read(file));
      } catch (error) {
        this.showSetup(`\u05D4\u05E7\u05D5\u05D1\u05E5 \u05D0\u05D9\u05E0\u05D5 JSON \u05EA\u05E7\u05D9\u05DF: ${error.message}`);
      }
    }
    adoptBank(bank) {
      this.bank = bank;
      this.config = defaultConfig(bank);
      this.showSetup();
    }
    // -- the sitting ---------------------------------------------------------
    begin() {
      this.sitting = this.deps.buildSitting.execute({ bank: this.bank, ...this.buildOptions() });
      this.cursor = 0;
      this.responses = {};
      this.spent = {};
      this.essay = "";
      this.showStep();
    }
    next() {
      this.cursor++;
      this.paintProgress();
      this.showStep();
    }
    paintProgress() {
      if (!this.sitting) return this.deps.chrome.showProgress(0);
      const done = this.sitting.steps.slice(0, this.cursor).reduce((n, step) => n + (step.seconds ?? 0), 0);
      this.deps.chrome.showProgress(done / Math.max(1, this.sitting.summary.totalSeconds));
    }
    showStep() {
      this.deps.countdown.stop();
      const step = this.sitting?.steps[this.cursor];
      if (!step || step.kind === "end") return this.showResults();
      switch (step.kind) {
        case "section-intro":
          return this.showIntro(step);
        case "break":
          return this.showBreak(step);
        case "writing":
          return this.showWriting(step);
        case "stimulus":
          return this.showStimulus(step);
        case "item":
          return this.showItem(step);
        default:
          return this.next();
      }
    }
    /** Runs the clock for a step; `visibleDial` is false during breaks. */
    runClock(seconds, onExpire, visibleDial = true) {
      this.deps.countdown.start(seconds, {
        onTick: (remaining, total) => this.deps.chrome.showTime(remaining, total, visibleDial),
        onExpire
      });
      this.deps.chrome.showTime(seconds, seconds, visibleDial);
    }
    bindAdvance(advance) {
      const button = this.deps.screen.byId("go");
      if (button) button.onclick = advance;
      this.deps.screen.onKey((event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          advance();
        }
      });
    }
    showIntro(step) {
      this.deps.chrome.showTime(0, 0, false);
      this.deps.screen.render(renderSectionIntro(step));
      this.bindAdvance(once(() => this.next()));
    }
    showBreak(step) {
      const { screen, countdown } = this.deps;
      screen.render(renderBreak(step, this.rules().breaks.skippable));
      const bigClock = screen.byId("bigclock");
      const advance = once(() => this.next());
      countdown.start(step.seconds, {
        onTick: (remaining, total) => {
          this.deps.chrome.showTime(remaining, total, false);
          if (bigClock) bigClock.textContent = formatDuration(remaining);
        },
        onExpire: advance
      });
      this.deps.chrome.showTime(step.seconds, step.seconds, false);
      this.bindAdvance(advance);
    }
    showWriting(step) {
      const { screen } = this.deps;
      screen.render(renderWriting(step));
      const textarea = screen.byId("essay");
      const words = screen.byId("words");
      const lines = screen.byId("lines");
      const meter = screen.byId("lw");
      const update = () => {
        this.essay = textarea?.value ?? "";
        const wordCount = (this.essay.trim().match(/\S+/g) ?? []).length;
        const lineCount = this.essay.split("\n").reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 62)), 0);
        if (words) words.textContent = String(wordCount);
        if (lines) lines.textContent = String(lineCount);
        meter?.classList.toggle("short", lineCount < step.minLines);
      };
      if (textarea) {
        textarea.oninput = update;
        textarea.focus();
      }
      update();
      const finish = once(() => {
        this.essay = textarea?.value ?? this.essay;
        this.next();
      });
      this.runClock(step.seconds, finish);
      const go = screen.byId("go");
      if (go) go.onclick = finish;
      screen.onKey((event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          finish();
        }
      });
    }
    showStimulus(step) {
      this.deps.screen.render(renderStimulus(step));
      const advance = once(() => this.next());
      this.runClock(step.seconds, advance);
      this.bindAdvance(advance);
    }
    showItem(step) {
      const { screen, countdown } = this.deps;
      const steps = this.sitting?.steps ?? [];
      const stimulus = step.stimulusId ? steps.find(
        (other) => other.kind === "stimulus" && other.stimulusId === step.stimulusId
      ) ?? null : null;
      const siblings = steps.filter(
        (other) => other.kind === "item" && other.sectionId === step.sectionId
      );
      screen.render(
        renderItem({
          step,
          stimulus,
          position: siblings.indexOf(step) + 1,
          of: siblings.length
        })
      );
      const options = screen.all(".opt");
      const choose = (choice) => {
        this.responses[step.itemId] = choice;
        for (const option of options)
          option.setAttribute("aria-checked", String(Number(option.dataset.i) === choice));
      };
      for (const option of options)
        option.onclick = () => choose(Number(option.dataset.i));
      const finish = once(() => {
        this.spent[step.itemId] = Math.round(countdown.total() - countdown.remaining());
        this.next();
      });
      this.runClock(step.seconds, finish);
      const go = screen.byId("go");
      if (go) go.onclick = finish;
      screen.onKey((event) => {
        if (/^[1-4]$/.test(event.key)) {
          event.preventDefault();
          choose(Number(event.key));
        } else if (event.key === "Enter") {
          event.preventDefault();
          finish();
        }
      });
    }
    // -- results -------------------------------------------------------------
    showResults() {
      const { screen, chrome, countdown, scoreAttempt, saver } = this.deps;
      countdown.stop();
      chrome.showTime(0, 0, false);
      chrome.showProgress(1);
      screen.onKey(null);
      const sitting = this.sitting;
      if (!sitting) return this.showSetup();
      const attempt = scoreAttempt.execute({
        sitting,
        responses: this.responses,
        spent: this.spent,
        essay: this.essay
      });
      screen.render(
        renderResults({ report: attempt.score, spent: this.spent, essay: this.essay })
      );
      const again = screen.byId("again");
      if (again) again.onclick = () => this.showSetup();
      const download = screen.byId("dl");
      if (download)
        download.onclick = () => saver.save(`${sitting.meta.id ?? "mapam"}-attempt.json`, attempt);
    }
    rules() {
      return this.sitting?.rules ?? RULES;
    }
  };
  function defaultConfig(bank) {
    const minutes = bank?.writingTask?.minutes;
    return {
      writingMinutes: minutes ?? RULES.writing.defaultMinutes,
      blueprint: "full",
      seed: "a",
      includeWriting: true
    };
  }

  // src/presentation/web/main.ts
  function required(selector) {
    const element = document.querySelector(selector);
    if (!element) throw new Error(`\u05D4\u05E8\u05E6\u05D4 \u05E0\u05DB\u05E9\u05DC\u05D4: \u05D7\u05E1\u05E8 \u05D4\u05D0\u05DC\u05DE\u05E0\u05D8 ${selector}`);
    return element;
  }
  function bootstrap() {
    const controller = new RunnerController({
      screen: new DomScreen(required("#app")),
      chrome: new DomChrome(
        required("#dial"),
        required("#arc"),
        required("#clock"),
        required("#rail i")
      ),
      countdown: new IntervalCountdown(),
      bankFiles: new BrowserBankFileReader(),
      saver: new JsonFileSaver(),
      buildSitting: new BuildSittingUseCase(seededRandomFactory),
      scoreAttempt: new ScoreAttemptUseCase(),
      exampleBank: window.EXAMPLE_BANK ?? null
    });
    window.addEventListener("beforeunload", (event) => {
      if (!controller.isRunning()) return;
      event.preventDefault();
      event.returnValue = "";
    });
    controller.start();
    return controller;
  }
  bootstrap();
})();
</script>
